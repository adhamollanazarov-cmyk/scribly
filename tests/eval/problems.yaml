    - { name: W_net, value: 70.95, unit: J }
    - { name: v, value: 5.327288240176927, unit: m/s }
  must_draw: [free_body|vector]

- id: mech-torque
  topic: mechanics/statics
  level: simple
  source: own
  input: >-
    A uniform 2.0 m beam is balanced on a pivot at its centre. A 30 N downward force acts
    0.80 m to the left of the pivot. Find the torque of that force about the pivot and the
