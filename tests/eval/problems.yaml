    - { name: KE_lost, value: 3.0, unit: J }
  must_draw: []

- id: mech-work-energy
  topic: mechanics/energy
  level: university
  source: own
  input: >-
    A 5.0 kg box starts from rest on a level floor and is pushed 4.0 m by a constant
    horizontal force of 30 N. The coefficient of kinetic friction between box and floor
