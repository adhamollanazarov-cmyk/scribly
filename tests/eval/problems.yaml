    balanced.
  expected:
    - { name: torque, value: 24.0, unit: N*m }
    - { name: F, value: 40.0, unit: N }
  must_draw: [vector|arrow]

- id: mech-tension
  topic: mechanics/statics
  level: simple
  source: own
  input: >-
    A 4.0 kg lamp hangs at rest from two identical ropes. Each rope makes an angle of 30
