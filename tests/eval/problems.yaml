    - { name: I, value: 4.0, unit: A }
    - { name: I1, value: 3.0, unit: A }
    - { name: I2, value: 1.0, unit: A }
  must_draw: [line|polyline|rect]

- id: circ-power
  topic: circuits/power
  level: simple
