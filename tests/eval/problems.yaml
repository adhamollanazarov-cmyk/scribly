    - { name: v, value: 2.0, unit: m/s }
  must_draw: []

- id: mech-collision
  topic: mechanics/momentum
  level: simple
  source: own
  input: >-
    A 2.0 kg cart moving at 3.0 m/s on a frictionless track collides with a 1.0 kg cart
