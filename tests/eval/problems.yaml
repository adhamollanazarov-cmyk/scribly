    stops. Sketch its velocity-time graph and use it to find the stopping time and the
    stopping distance.
  expected:
    - { name: t, value: 5.0, unit: s }
    - { name: d, value: 62.5, unit: m }
  must_draw: [axes_plot|axes]

- id: kin-free-fall
  topic: kinematics/free-fall
  level: simple
  source: own
  input: >-
    A ball is dropped from rest from a height of 45 m. Ignore air resistance and take
    g = 9.81 m/s^2. Find the time it takes to reach the ground and its speed just before
    impact, and sketch its velocity-time graph.
  expected:
    - { name: t, value: 3.0289126640769, unit: s }
    - { name: v, value: 29.713633234594, unit: m/s }
  must_draw: [axes_plot|axes]

- id: kin-a-from-vt
  topic: kinematics/graphs
  level: simple
  source: own
  input: >-
    On a velocity-time graph a runner's velocity rises along a straight line from 4.0 m/s
    at t = 1.0 s to 16 m/s at t = 5.0 s. Find the acceleration from the slope and the
