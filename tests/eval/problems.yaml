  expected:
    - { name: a, value: 3.0, unit: m/s**2 }
    - { name: dx, value: 40.0, unit: m }
  must_draw: [axes_plot|axes]

- id: kin-piecewise
  topic: kinematics/graphs
  level: university
  source: own
  input: >-
    A train starts from rest and speeds up uniformly to 10 m/s in 5.0 s, then travels at
    10 m/s for 10 s, then slows uniformly to rest in 4.0 s. Draw its velocity-time graph.
    Find the total distance travelled and the average speed for the whole trip.
  expected:
    - { name: d, value: 145.0, unit: m }
    - { name: v_avg, value: 7.631578947368421, unit: m/s }
  must_draw: [axes|axes_plot]

# --- circuits -------------------------------------------------------------------------

- id: circ-series
  topic: circuits/series
  level: simple
  source: own
  input: >-
    An ideal 9.0 V battery is connected to three resistors in series: R1 = 100 ohm,
    R2 = 200 ohm and R3 = 300 ohm. Find the current in the circuit and the voltage across
    R2.
  expected:
    - { name: I, value: 0.015, unit: A }
    - { name: V2, value: 3.0, unit: V }
  must_draw: [line|polyline|rect]

- id: circ-parallel
  topic: circuits/parallel
  level: simple
  source: own
  input: >-
    Two resistors, R1 = 4.0 ohm and R2 = 12 ohm, are connected in parallel across an ideal
    12 V battery. Find the equivalent resistance, the total current from the battery, and
    the current through each resistor.
  expected:
