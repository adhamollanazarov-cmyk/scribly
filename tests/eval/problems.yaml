    - { name: V_C, value: 4.323323583816936, unit: V }
  must_draw: [axes_plot|curve]

- id: circ-kirchhoff
  topic: circuits/kirchhoff
  level: university
  source: own
  input: >-
    Two nodes, A (top) and B (bottom), are joined by three branches. Left branch: an
    ideal 10 V battery with its positive terminal toward A, in series with R1 = 2.0 ohm.
    Middle branch: R3 = 6.0 ohm alone. Right branch: an ideal 5.0 V battery with its
    positive terminal toward A, in series with R2 = 4.0 ohm. Use Kirchhoff's laws to find
    the current in each branch, including its direction.
  expected:
    - { name: I3, value: 1.1363636363636365, unit: A }
    - { name: I1, value: 1.5909090909090908, unit: A }
    - { name: I2, value: 0.45454545454545453, unit: A }
  must_draw: [line|polyline|rect]
