# --- kinematics graphs ----------------------------------------------------------------

- id: kin-vt-area
  topic: kinematics/graphs
  level: simple
  source: own
  input: >-
    A velocity-time graph shows a cart speeding up uniformly from 0 to 12 m/s during the
    first 4.0 s, then moving at a constant 12 m/s for the next 6.0 s. Find its
    acceleration during the first 4.0 s and its total displacement over the 10 s, using
    the area under the graph.
  expected:
    - { name: a, value: 3.0, unit: m/s**2 }
    - { name: x, value: 96.0, unit: m }
  must_draw: [axes_plot|axes]

- id: kin-xt-slope
  topic: kinematics/graphs
  level: simple
  source: own
  input: >-
    A position-time graph of a walker is a straight line from x = 2.0 m at t = 0 s to
    x = 14 m at t = 4.0 s. Find the walker's velocity from the slope of the graph and
    explain what a steeper line would mean.
  expected:
    - { name: v, value: 3.0, unit: m/s }
  must_draw: [axes_plot|axes]

- id: kin-braking
  topic: kinematics/graphs
  level: simple
  source: own
  input: >-
